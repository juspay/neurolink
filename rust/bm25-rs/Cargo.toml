[package]
name = "bm25-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Rust port of `src/lib/rag/retrieval/bm25Core.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
