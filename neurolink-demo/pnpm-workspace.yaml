# Keep the demo's own package and frozen lockfile in scope during pnpm's upward
# workspace search, as the standalone docs-site and landing projects do.
# Retain the root release-age policy and existing native build allowlist.
minimumReleaseAge: 4320
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - puppeteer
  - ffmpeg-static
  - sharp

# The demo resolves NeuroLink's own dependency tree through `file:../`, so the root's
# overrides do not reach it and `pnpm audit` here does not walk that subtree. These mirror
# the root floors for the packages that tree pulls in.
overrides:
  "@opentelemetry/core@>=2.0.0 <2.8.0": ">=2.8.0"
  "adm-zip@<0.6.1": ">=0.6.1"
  "body-parser@<1.20.9": ">=1.20.9 <2"
  "body-parser@>=2.0.0 <2.4.0": ">=2.4.0 <3"
  "fast-uri@<3.1.9": ">=3.1.9 <4"
  "fast-uri@>=4.0.0 <4.2.3": ">=4.2.3 <5"
  "image-size@<2.0.3": ">=2.0.3"
  "ip-address@<10.7.4": ">=10.7.4"
  "sharp@<0.35.5": ">=0.35.5"
  "uuid@<11.1.1": ">=11.1.1 <12"
