# Supply-chain cooldown: delay adoption of freshly published npm releases across every
# dependency (including the single-maintainer untrusted-input parsers: adm-zip,
# fast-xml-parser, pdf-parse, mammoth, js-yaml, chardet, jsonrepair, sharp)
# by 3 days, giving the ecosystem time to catch a compromised release before it can be
# resolved here. No `packages:` field is set, so this does not turn the repo into a
# pnpm workspace — landing/ and docs-site/ remain independent projects (see
# docs-site/pnpm-workspace.yaml, added alongside this file, for why that needed a shield).
#
# Only pnpm 10.16 and later read this setting; older releases ignore it without a word.
# The repo ran on 10.15.1 for weeks with the cooldown declared and not applied, and the
# lockfile took fast-copy 4.1.2 about 7 hours after it was published. Keep package.json
# `packageManager` and every `pnpm/action-setup` version in .github/workflows at or above
# 10.16 (they must also match each other, or action-setup refuses to run); package.json
# `engines.pnpm` refuses an older pnpm outright.
minimumReleaseAge: 4320
