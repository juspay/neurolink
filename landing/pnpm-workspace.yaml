onlyBuiltDependencies:
  - esbuild

# Kept here and not under "pnpm" in package.json: pnpm 11 and later no longer read
# that field, so a shell that resolves a newer pnpm than the repository's 10.28.2
# (landing/ declares no packageManager) saw no overrides and refused the frozen
# install with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. This file is read by every
# version, and the lockfile records the same overrides.
overrides:
  tar: ">=7.5.19"
  devalue: ">=5.9.3 <6"
  rollup: ">=4.59.0"
  minimatch: ">=10.2.3"
  "cookie@<0.7.0": ">=0.7.0"
  fflate: ">=0.8.3"
  "esbuild@>=0.17.0 <0.28.1": ">=0.28.1"
  "brace-expansion@>=5.0.0 <5.0.12": ">=5.0.12"
  "nanoid@<3.3.18": ">=3.3.18 <4"
  "postcss@<8.5.23": ">=8.5.23 <9"
  "source-map-js@<1.2.2": ">=1.2.2"
