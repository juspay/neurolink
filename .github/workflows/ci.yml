  #         if [ -z "$RESPONSE" ]; then
  #           echo "ERROR: No response received"
  #           exit 1
  #         fi

  #         if [ -z "$PROVIDER" ]; then
  #           echo "ERROR: Provider not reported"
  #           exit 1
  #         fi

  #         echo "✅ Action smoke test passed!"

  # Builds with a full install, prunes optionalDependencies, then runs the
  # built CLI against the pruned tree.
  # optionalDependencies (express, the AWS SDK bedrock/sagemaker clients,
  # fastify, koa, etc.) are exactly the packages npm/pnpm silently skip on a
  # failed native build or a --no-optional install, so "it built" here proves
  # nothing about whether the CLI still runs without them.
  #
  # This job is now BLOCKING. It spent its whole life non-blocking and red —
  # first because it installed --no-optional before building (so rolldown's
  # own native binding vanished and the build tool disappeared), then because
  # it built with `build:cli` on a clean checkout (so the collapse step found
  # every rewritten specifier dangling). Neither failure ever ran a smoke
  # step, and continue-on-error meant nothing ever complained.
  #
  # Both are fixed, d9f0b495 made `--help` survive the prune, and the job
  # reported SUCCESS on the run that fixed it. A green non-blocking job
  # protects nothing, so the error suppression comes off here.
  #
  # Note @aws-sdk/client-bedrock-runtime is also statically imported from an
  # optionalDependency (amazonBedrock/client.ts, amazonBedrock/loopAdapter.ts).
  # That import is not reachable from `--help`, `--version` or
  # `generate --help`, which is why those three pass today; if a later change
  # pulls it onto the entrypoint path this job goes red, and that is the job
  # working, not the check being too strict.
  optional-deps-omitted-smoke-test:
    name: CLI Smoke Test (optional deps omitted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Build with a FULL install, then prune. The previous order installed
      # --no-optional first and never reached the CLI at all: rolldown's
      # native binding (@rolldown/binding-linux-x64-gnu) is itself an
      # optionalDependency, so the BUILD TOOL disappeared and the job failed
      # at "Build CLI" with "Cannot find native binding" — red forever, and
      # proving nothing about the CLI.
      #
      # What this job exists to prove is a RUNTIME property: that the built
      # CLI still starts when the optional runtime packages are absent. So the
      # build gets everything it needs, and only the run is starved.
      - name: Install dependencies (full, for the build)
        run: pnpm install --frozen-lockfile

      # The FULL build, not `build:cli`. `build:cli` alone is a
      # developer-iteration shortcut that assumes a `vite build` output is
      # already sitting in dist/: it runs tsc plus
      # scripts/collapse-cli-lib-duplicate.mjs, and that script rewrites
      # dist/cli's "../../lib/x.js" specifiers to "../../x.js" and then
      # verifies each one resolves. On a clean CI checkout the vite half of
      # dist/ does not exist, so every rewritten specifier dangles and the
      # script exits 1 by design — "the build is broken and must fail loudly
      # instead of shipping a CLI with dangling imports".
      #
      # That is exactly what happened here: this job failed at Build CLI on
      # every run since it was added, so the three smoke steps below had
      # never once executed. `pnpm run build` runs `vite build` and then
      # prepack, which itself runs build:cli — both halves, in the order the
      # collapse script requires.
      # Reuse dist when every input to the build is byte-identical.
      #
      # There are deliberately NO restore-keys. A partial-prefix match would
      # serve a dist built from different sources, and a stale build that still
      # reports green is the precise failure this repo has been removing. An
      # exact hash miss just rebuilds, which costs what it costs today.
      - name: Restore built dist
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'svelte.config.js', 'scripts/build-browser.mjs', 'scripts/collapse-cli-lib-duplicate.mjs') }}

      # A cache HIT restores dist/ with the mtimes it was SAVED with, while
      # actions/checkout stamps src/ with checkout time — so the repo's
      # assertDistFresh guard reads a genuinely current dist as stale and kills
      # every suite that imports it. The key above hashes src/** and every
      # build input, so a hit proves dist matches this exact tree; re-stamping
      # its mtimes is truthful, not a freshness bypass.
      #
      # That truth DEPENDS on the key being exact: never add `restore-keys`
      # to the cache step above. A prefix match would restore a dist built
      # from DIFFERENT sources, and this touch would then make
      # assertDistFresh certify stale code as fresh — converting the guard's
      # loud, correct abort into silently testing the wrong build.
      - name: Stamp restored dist as fresh
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: find dist -exec touch {} +

      - name: Build (full — the CLI's collapse step needs the SDK output)
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      # dist/ survives this: it lives outside node_modules, so the CLI below
      # is the artifact built above, now running against a pruned tree.
      - name: Re-install with optionalDependencies omitted
        run: pnpm install --no-optional

      - name: CLI smoke test — --help
        run: node dist/cli/index.js --help

      - name: CLI smoke test — --version
        run: node dist/cli/index.js --version

      - name: CLI smoke test — generate --help
        run: node dist/cli/index.js generate --help

  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Check package build
        run: pnpm run prepack

      - name: Verify package contents
        run: |
          pnpm pack
          ls -la dist/

  # Deliberately NOT a required status check. These suites are new and this job
  # exists so a regression in them is visible, not so it can block a merge on
  # day one. Promote it to required once it has proven stable.
  #
  # "Stable" had no evidence attached, so: sampled 2026-08-27 over the last 6 CI
  # runs, all 24 Extended Suites shard results were success.
  #
  # That is not the whole argument, and the other half points the other way.
  # Being non-blocking is what let four suites be wired into this list in one
  # day. One of those attempts went red — test:proxy failed on a single
  # attribution case that no local configuration reproduced — and the wire-in
  # was simply reverted. Had this job been required, that experiment would have
  # blocked every open pull request instead of reporting a result.
  #
  # So the 24/24 is evidence the job is healthy, not evidence that promoting it
  # is free. The cost lands on whoever next adds a suite. Worth promoting when
  # the suite list stops changing weekly; today it is still being filled in.
  #
  # It exists at all because the alternative was demonstrated: the OpenAI-compat
  # catalog suite sat in no CI job, broke (it threw on any machine without
  # GROQ_API_KEY), and nobody noticed — because nothing ran it. A suite wired
  # into nothing is documentation, not a test.
  extended-suites:
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs even if another fails, so one broken suite never
      # hides the state of the other 37 — the same property the loop below
      # has always had within a single job.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # This job checks out and executes repository code on pull_request.
    # The repository default is a WRITE-scoped token (and one that may
    # approve reviews); nothing here needs either. Read is enough to
    # checkout, install and run suites.
    name: Extended Suites (non-blocking) ${{ matrix.shard }}/4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SvelteKit sync
        run: pnpm exec svelte-kit sync

      # Every one of these suites imports from ../dist/index.js per rule 15, so
      # the built output is a prerequisite rather than an optimisation.
      # Reuse dist when every input to the build is byte-identical.
      #
      # There are deliberately NO restore-keys. A partial-prefix match would
      # serve a dist built from different sources, and a stale build that still
      # reports green is the precise failure this repo has been removing. An
      # exact hash miss just rebuilds, which costs what it costs today.
      - name: Restore built dist
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'svelte.config.js', 'scripts/build-browser.mjs', 'scripts/collapse-cli-lib-duplicate.mjs') }}

      # A cache HIT restores dist/ with the mtimes it was SAVED with, while
      # actions/checkout stamps src/ with checkout time — so the repo's
      # assertDistFresh guard reads a genuinely current dist as stale and kills
      # every suite that imports it. The key above hashes src/** and every
      # build input, so a hit proves dist matches this exact tree; re-stamping
      # its mtimes is truthful, not a freshness bypass.
      #
      # That truth DEPENDS on the key being exact: never add `restore-keys`
      # to the cache step above. A prefix match would restore a dist built
      # from DIFFERENT sources, and this touch would then make
      # assertDistFresh certify stale code as fresh — converting the guard's
      # loud, correct abort into silently testing the wrong build.
      - name: Stamp restored dist as fresh
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: find dist -exec touch {} +

      - name: Build
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Run extended suites
        run: |
          # No provider credentials are set in this job, and that is the point:
          # each of these suites drives the public API against stubs, local
          # fixtures or mocked fetch, so a suite that starts making real network
          # calls fails here rather than silently costing money and flaking.
          #
          # The list below grew from 8 to 38. The 30 added were not picked by
          # reading them: every suite script that CI never invoked was run with
          # the environment fully stripped — `env -i` plus
          # DOTENV_CONFIG_PATH=/dev/null, checked to actually suppress .env —
          # and only the ones that passed that way are here. They contribute
          # 373 assertions.
          #
          # test:middleware is still held back, and the cause is now measured
          # rather than guessed. Diagnosed 2026-08-27.
          #
          # The suite's header says "provider-dependent tests SKIP when
          # credentials are not configured". It never checks. It issues all
          # seven live calls — defaulting to vertex — and classifies whatever
          # error comes back. With no credentials those calls still go out, to
          # oauth2.googleapis.com and aiplatform.googleapis.com, and Google
          # throttles them progressively.
          #
          # Five identical consecutive credential-free runs, same machine, same
          # tree, nothing else changed:
          #
          #     62s -> 77s -> 95s -> 145s -> 269s
          #
          # Monotonic, 4.3x, all still passing 7/7. Nothing in the suite is
          # slowing down; the far end is. Its per-case bound is the harness
          # default of 240s — the suite calls `withCaseTimeout(name, fn)` with
          # no third argument, and its own `TEST_CONFIG.timeout: 60_000` is
          # declared once and never read by anything. A case that trips 240s
          # does not merely fail — the runner `break`s, because a raced-out
          # case is still executing and the process no longer has clean state.
          # So the remaining cases are recorded as not run, and one slow call
          # takes the whole suite down. The 269s run above is already past that
          # bound, which is the point: the trend, not any single figure, is what
          # makes this reproducible.
          #
          # That is why the earlier note found it "reproducible in context, not
          # flaky", and why blaming the immediately preceding suite was refuted:
          # the load is CUMULATIVE, not adjacent. test:auth and test:dynamic
          # both reach the same two googleapis hosts earlier in the run — 7 and
          # 5 live generate/stream calls respectively, all defaulting to vertex
          # — so by the time middleware starts, the throttle is already
          # established. (test:provider-descriptors runs between them but is
          # NOT part of this: it issues no generate/stream call at all, and its
          # getProviderStatus() path short-circuits on absent env vars before
          # any request goes out.) Alone, or straight after test:mcp, it is early
          # enough to be fast — which is exactly what was observed.
          #
          # The fix is to honour what the header already promises: probe once,
          # and skip the rest without calling when the provider is unavailable,
          # instead of making seven attempts into a tightening throttle. That
          # needs care, because a case returns null both for "provider
          # unavailable" and for an ordinary in-test skip, so the two have to be
          # told apart at all seven call sites first. Not attempted here: the
          # credentialed path could not be exercised to prove it unchanged.
          # Worth 7 assertions to whoever finishes it.
          #
          # test:multimodal:sdk used to "exit non-zero with no summary", and
          # the cause was never in the suite's assertions. The repo's tracked
          # .mcp-config.json declares a `filesystem` server started via
          # `npx -y @modelcontextprotocol/server-filesystem`, with
          # autoDiscovery and autoRegister both on, so every NeuroLink the
          # suite builds tried to start it and waited the full 60s MCP client
          # timeout when it could not — once per instance, fourteen times.
          # Measured: 11 such timeouts and still running past 20 minutes, which
          # is why it was killed before printing anything. The suite now sets
          # NEUROLINK_SKIP_MCP, as test:proxy already did, and finishes in 58s
          # at 14/14. It does not test MCP; it tests whether a file handed to
          # generate() reaches the model.
          #
          # test:proxy stays out too, but the recorded reason for it was
          # wrong, and the real one only showed up in CI.
          #
          # The old reading was that it "passes with credentials (74/6) and
          # fails without them (68/5/7)". Those conditions are the wrong way
          # round, and the axis is not credentials at all.
          #
          # It neutralises its own environment before anything else runs — a
          # mkdtemp HOME, USERPROFILE and XDG_CONFIG_HOME, and it deletes
          # ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, OPENAI_API_KEY and
          # GOOGLE_API_KEY outright unless NEUROLINK_PROXY_TEST_ALLOW_LIVE=1.
          # Ambient credentials therefore cannot reach it, which is why running
          # it with and without them produces byte-identical results.
          #
          # The failing condition is the opt-in one, not the bare one:
          #
          #   default (keys deleted by the suite)   74 passed / 6 skipped / 0 failed
          #   NEUROLINK_PROXY_TEST_ALLOW_LIVE=1     75 passed / 0 skipped / 5 failed
          #
          # and those five are live round-trips failing on the account's credit
          # balance, not on anything the suite does. CI never sets that
          # variable, so CI gets the first row.
          #
          # It was wired in on that basis — seven local runs across five
          # environments, all 74/6/0 — and CI disagreed on the first attempt:
          #
          #   local  (7 runs, 5 environments)   74 passed / 0 failed / 6 skipped
          #   CI     (run 33021689979)          71 passed / 1 FAILED / 8 skipped
          #
          # The single failure is "Attribution: the request log records the
          # calling CLI", asserting "request log carried no attribution for the
          # unknown caller". It sends two requests under different
          # user-agents, then reads the proxy's request log back and expects a
          # record for each; in CI the unknown-caller record was absent. Note
          # the skip count also moves, 6 to 8, so the environments differ in
          # more than that one case.
          #
          # Local green across many environments is not evidence about CI: no
          # local configuration reproduced it. Whoever picks this up starts
          # from a named failing case rather than from a guess, and should
          # check whether the log write races the read-back. CI measured the
          # suite at 37s, so weight it there and not at the 80s that was
          # extrapolated from local timings.
          #
          # The 55669 in that suite is a config string it writes into client
          # config files and asserts on — never a request target — so an
          # operator's own proxy listening there does not affect it. That is
          # correct: fetchProxy targets PROXY_PORT, which is 9876.
          #
          # It is also incomplete, in the direction that misleads. The suite is
          # NOT isolated from a running proxy, because the coupling is the log
          # file rather than the port. startProxy() spawns with neither --dev
          # nor a HOME override, so its request log resolves to
          # ~/.neurolink/logs/proxy-<date>.jsonl — the same append-only file an
          # operator's own daemon writes to. testPerClientAttribution then
          # stats that path via os.homedir(), sends its two requests, and reads
          # back everything appended past the recorded offset. Both proxies'
          # records land in that window: on the machine where this was checked,
          # the last 4000 lines held 397 claude-code and 198 unknown entries,
          # the latter being the test's own synthetic user-agent mixed in with
          # live traffic.
          #
          # What that does and does not establish, stated separately because
          # the difference is the whole value of it:
          #
          #   Established, by reading the spawn and confirmed in the log: the
          #   read-back window is shared, unscoped, and not synchronised with
          #   anything.
          #
          #   NOT established: that concurrency is the cause. The failure was
          #   seen twice while other work drove a second proxy, but two
          #   deliberate attempts to reproduce it — one with sustained load,
          #   one with three parallel generators — both passed 88/0. Treat the
          #   correlation as a lead, not a diagnosis.
          #
          # For CI the shared-log path is probably not it, since a runner has
          # no second proxy; the race the paragraph above names remains the
          # better hypothesis there. The value here is that the read-back has
          # no synchronisation to rely on in either environment, and that an
          # investigator should stop treating "no operator proxy on 55669" as
          # evidence of isolation.
          #
          # test:model-not-found-retryable is also absent: it skips entirely
          # without credentials, so it could only ever no-op here — the same
          # reason it is held out of the security-suites job.
          #
          # This job is non-blocking on purpose. These are measured once, not
          # proven stable, and `security-suites` is a required check that
          # blocks every open pull request when it breaks.
          # name@seconds, longest first. The weights affect BALANCE ONLY —
          # never which suites run. A stale weight makes one shard slower; it
          # can never cause a suite to be skipped or run twice. An entry with
          # no @weight still runs, at an assumed 30s.
          #
          # Refreshed 2026-08-27: median of 13 runs, read from this job's own
          # logs. The previous set came from a single run (32808851519) and one
          # entry had gone badly stale — test:tts:unit was still carrying 367s
          # after the deadlock fix in #1550 cut it to a median of 140s, a 2.6x
          # overstatement that survived because nothing re-measures.
          #
          # To re-measure, do NOT time these locally: a developer machine is
          # faster than a runner AND has credentials, so suites that skip in CI
          # do real work here. Measuring test:tts:unit locally gives ~73s
          # against a CI median of 140s — wrong by nearly half, in the
          # direction that would have made the imbalance look worse than it is.
          # Read the real thing instead; the ::group:: markers below are
          # timestamped in the raw job log:
          #
          #   gh api repos/juspay/neurolink/actions/jobs/<id>/logs | awk '
          #     function secs(ts,   a) { split(substr(ts,12,8), a, ":")
          #                              return a[1]*3600 + a[2]*60 + a[3] }
          #     /##\[group\]test:/        { t=secs($1); n=$2; sub(/^##\[group\]/,"",n) }
          #     /##\[endgroup\]/ && n!="" { d=secs($1)-t; if (d<0) d+=86400
          #                              printf "%s@%d\n", n, d; n="" }'
          #
          # That prints `suite@seconds` — the exact shape of a SUITES line, so
          # the output pastes straight in. It avoids gawk's mktime(), which BSD
          # awk (macOS) does not have, and adds a day's seconds back when a job
          # crosses midnight UTC. It was run against a captured log before being
          # written down here, which the version it replaces was not: that one
          # bound the timestamp only at ::group:: and never read the ::endgroup::
          # one, so it printed a start time and a `##[group]`-prefixed name and
          # never computed a duration at all.
          #
          # Take a median across several runs, not one sample: the observed
          # per-suite range is wide (test:tts:unit spans 95s to 155s).
          #
          # Two entries are skip-times, not work-times. test:tool-reliability
          # and test:autoresearch are live-tier and have no credentials here, so
          # what is being weighted is how long they take to decide to skip. That
          # is the correct number for THIS job, and the wrong number to reuse
          # anywhere that runs them for real.
          #
          # Round-robin by list position was the previous scheme. It balances
          # the COUNT of suites, which is the wrong quantity: the measured
          # spread is 1s to 140s, so equal counts gave shards of 90s and 241s.
          SUITES="
            test:tts:unit@140
            test:agent-delegation@78
            test:error-classification-e2e@71
            test:background-commands@23
            test:agent-tasks@13
            test:artifact-banking@13
            test:multimodal:sdk@110
            test:agents@7
            test:media-registry-collisions@3
            test:video-abort@3
            test:classifier-router@3
            test:resolve-request-kind@1
            test:vertex-loop-characterization@100
            test:tool-reliability@57
            test:auth@50
            test:vertex-claude-characterization@46
            test:openai-compat-catalog@24
            test:provider-descriptors@17
            test:openai-compat-streaming-retry@16
            test:servers@16
            test:video:unit@12
            test:adjust-body-after-400@10
            test:anthropic-streaming-retry@10
            test:dynamic@10
            test:local-usage@8
            test:provider-fallback-latency@6
            test:codex@5
            test:credentials@4
            test:stt:unit@4
            test:avatar:unit@3
            test:mcp@3
            test:model-manifests@3
            test:music:unit@3
            test:provider-fallback@3
            test:realtime:unit@3
            test:tool-resolution@3
            test:autoresearch@2
            test:loop-engine@2
            test:stream-middleware@5
            test:handler-registry@1
          "
          # Normalise every entry to name@weight (missing or non-numeric
          # weights become 30), then sort by weight descending. Greedy
          # longest-processing-time needs its input longest-first, and sorting
          # here means that is a property of the code rather than of how
          # carefully someone maintained the list above. The list is written in
          # descending order for readability, but nothing depends on it being
          # so — add an entry anywhere.
          NORMALISED=""
          for entry in $SUITES; do
            case "$entry" in
              *@*) w="${entry##*@}"
                   case "$w" in ''|*[!0-9]*) entry="${entry%@*}@30" ;; esac ;;
              *)   entry="$entry@30" ;;
            esac
            NORMALISED="$NORMALISED $entry"
          done
          SORTED=$(printf '%s\n' $NORMALISED | sort -t@ -k2,2rn)

          # Give each suite to whichever shard is currently least loaded. Every
          # runner sorts the same input the same way, so all four independently
          # compute an identical assignment without coordinating. The list
          # stays single-sourced; only which entries this runner executes
          # changes.
          FAILED=""
          L1=0; L2=0; L3=0; L4=0
          for entry in $SORTED; do
            s="${entry%@*}"
            # 10# forces base 10. Bash reads a leading zero as octal, so a
            # weight of 08 aborts the step outright ("value too great for
            # base") and 010 silently becomes 8 — a wrong weight is a worse
            # failure than a loud one, because it just quietly unbalances the
            # shards. The numeric guard above accepts both forms as digits.
            w="10#${entry##*@}"

            # if/fi rather than `[ ] && { }`: GitHub runs these steps with
            # `bash -e`, where a failing test in an AND-OR list can abort the
            # step. A comparison that is simply false is not an error here.
            target=1; best=$L1
            if [ "$L2" -lt "$best" ]; then target=2; best=$L2; fi
            if [ "$L3" -lt "$best" ]; then target=3; best=$L3; fi
            if [ "$L4" -lt "$best" ]; then target=4; best=$L4; fi
            case "$target" in
              1) L1=$((L1 + w)) ;;
              2) L2=$((L2 + w)) ;;
              3) L3=$((L3 + w)) ;;
              4) L4=$((L4 + w)) ;;
            esac
            if [ "$target" -ne ${{ matrix.shard }} ]; then
              continue
            fi
            echo "::group::$s"
            if pnpm run "$s"; then
              echo "PASS $s"
            else
              echo "FAIL $s"
              FAILED="$FAILED $s"
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "──────────────────────────────────────────────"
          if [ -n "$FAILED" ]; then
            # Every suite runs before failing, so one broken suite does not hide
            # the state of the other seven.
            echo "Failing suites:$FAILED"
            exit 1
          fi
          echo "All extended suites passed."

  proxy-performance:
    name: Proxy Performance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run proxy performance gates
        run: pnpm run proxy:performance

  quality-gate:
    runs-on: ubuntu-latest
    name: 🛡️ Code Quality & Security Gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: 🔍 Build Validation
        run: |
          echo "🔍 Running comprehensive build validation..."
          pnpm run validate

      - name: 📝 Commit Message Validation
        run: |
          echo "📝 Validating commit message format..."
          # Get the commit message for validation and pass it to the validator
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Validating: $COMMIT_MSG"
          pnpm exec tsx scripts/commit-validation.ts "$COMMIT_MSG"

      - name: 🌍 Environment Validation
        run: |
          echo "🌍 Validating environment configuration..."
          pnpm run validate:env

      - name: 🔒 Security Validation
        run: |
          echo "🔒 Running security checks..."
          pnpm run validate:security

      # `pnpm run validate:security` above only audits the repo root
      # (scripts/security-check.ts runs `pnpm audit` from process.cwd()).
      # landing/ and docs-site/ each maintain their own independent
      # pnpm-lock.yaml and were getting zero audit coverage — exactly how two
      # critical advisories sat there unnoticed. This step gives them one.
      #
      # NOW BLOCKING, at critical severity only. The groundwork this step's
      # earlier note was waiting on has landed: #1415 raised the stale pnpm
      # overrides and both lockfiles cleared their criticals. Measured before
      # promoting, rather than assumed:
      #
      #   landing     critical=0  high=6   moderate=2
      #   docs-site   critical=0  high=17  moderate=15  low=3
      #
      #   pnpm audit --audit-level=critical   -> exit 0 in both trees
      #   pnpm audit (no flag)                -> exit 1 in both trees
      #
      # So `--audit-level=critical` is what makes a hard gate achievable today:
      # it fails on a genuinely new critical and stays quiet for the existing
      # high/moderate long tail, which is exactly the trade the earlier note
      # described. Without the flag this step would red-line every PR.
      #
      # The long tail is deliberately still unaudited-by-gate. Raising the bar
      # to `high` needs the high findings triaged or overridden first; doing it
      # now would just reinstate continue-on-error under a new name.
      #
      # That number was recorded as 23, and re-measuring confirms it. Measured
      # 2026-08-29, for the two trees THIS step actually audits, using the same
      # scope the step itself uses — `pnpm audit` with NO --prod, which is what
      # audit_criticals() below runs:
      #
      #   landing/     6 high   (plus 2 moderate)
      #   docs-site/  17 high   (plus 15 moderate, 3 low)
      #
      # So 23 high, unchanged. The root tree carries 8 more, but those are gated
      # separately by scripts/security-check.ts's per-advisory check, not by this
      # step; do not add them to this total.
      #
      # Scope is the whole trap here, and an earlier draft of this note fell into
      # it: measured WITH --prod, landing/ reports zero and docs-site/ is
      # unchanged, which reads as "landing/ is clean outright" and shrinks the
      # backlog to 17. Both halves of that are an artifact of the flag. landing/'s
      # six are devDependency-only (brace-expansion, postcss, nanoid, via the
      # vite/sveltekit toolchain) — real for this step, which audits the full
      # tree, and invisible to any command that adds --prod.
      #
      # Re-measure before acting on any of these figures. They are a snapshot of
      # a dependency tree, which moves on its own. Match the step's scope — no
      # --prod — or the numbers will not describe the gate:
      #   (cd landing   && pnpm audit)
      #   (cd docs-site && pnpm audit)
      - name: 🔒 Subpackage Dependency Audit (landing/, docs-site/)
        run: |
          set +e
          # Counts criticals from --json rather than trusting the exit code.
          #
          # `pnpm audit` exits non-zero both when it FINDS advisories and when it
          # fails to run at all, and those are different facts. A gate that
          # cannot tell them apart reports "a critical advisory is present"
          # whenever the registry is unreachable, the audit endpoint changes, or
          # the tool breaks — sending someone to hunt a vulnerability that does
          # not exist while the real problem is infrastructure.
          #
          # So: parse the report. No parseable report means the scan did not
          # run, which still fails the gate (a scan that did not look is not a
          # clean result) but says so accurately.
          audit_criticals() {
            local dir="$1" out
            out=$(cd "$dir" && pnpm audit --json 2>/dev/null)
            printf '%s' "$out" | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try {
                  const v = JSON.parse(s).metadata.vulnerabilities;
                  if (typeof v.critical !== "number") process.exit(3);
                  console.log(v.critical);
                } catch { process.exit(3); }
              });'
          }

          failed=0
          for tree in landing docs-site; do
            echo "🔍 Auditing $tree/ dependencies..."
            criticals=$(audit_criticals "$tree")
            if [ $? -ne 0 ]; then
              echo "❌ $tree/: pnpm audit produced no usable report — the scan did NOT run."
              echo "   This is an infrastructure failure, not a vulnerability. Check the"
              echo "   registry and the pnpm audit client before reading anything into it."
              failed=1
            elif [ "$criticals" -ne 0 ]; then
              echo "❌ $tree/: $criticals CRITICAL advisory/advisories present."
              echo "   Fix it, or raise the pnpm override, before merging."
              failed=1
            else
              echo "✅ $tree/: no critical advisories."
            fi
            echo ""
          done
          [ "$failed" -ne 0 ] && exit 1
          echo "✅ No critical subpackage advisories."

      - name: 📊 ESLint Quality Report
        run: |
          echo "📊 Generating ESLint quality report..."
          pnpm exec eslint src/ --format=json --output-file=eslint-report.json || true
          pnpm exec eslint src/ --format=stylish
        continue-on-error: true

      - name: 📈 TypeScript Compiler Check
        run: |
          echo "📈 Running TypeScript compiler strict checks on source files..."
          pnpm exec tsc --noEmit --strict --project tsconfig.json

      - name: 📋 Quality Summary
        run: |
          echo "📋 Build Rule Enforcement Summary:"
          echo "✅ Build validation passed"
          echo "✅ Environment validation passed"
          echo "✅ Security validation passed"
          echo "✅ TypeScript compilation passed"
          echo "✅ Commit message format validated"
          echo ""
          echo "🔒 Single Commit Policy:"
          echo "ℹ️  This workflow validates code quality for individual commits"
          echo "ℹ️  Single commit enforcement runs separately via PR validation"
          echo "ℹ️  See: Single Commit Per Branch Enforcement workflow"
          echo ""
          echo "🎉 All quality gates passed!"

  semantic-release-validation:
    runs-on: ubuntu-latest
    needs: [test, build-check, proxy-performance]
    # The one documented exception to the workflow-level `contents: read`.
    #
    # semantic-release calls verifyAuth() unconditionally — index.js:88, NOT
    # guarded by dryRun — which runs `git push --dry-run` and therefore needs
    # push permission. On pull_request it never gets that far: index.js:60
    # returns early with "triggered by a pull request and therefore a new
    # version won't be published". ci.yml also runs on push to release, where
    # that early return does not apply and verifyAuth does execute.
    #
    # So a PR can never demonstrate this failure — the trigger that exercises
    # it is the one a PR does not use. Caught in review on #1552 rather than by
    # its own green run.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Validate semantic-release configuration
        run: |
          pnpm exec semantic-release --dry-run \
            --plugins "@semantic-release/commit-analyzer" \
            --plugins "@semantic-release/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
