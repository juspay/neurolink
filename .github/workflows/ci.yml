name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

# Cancel a run that a newer push to the same ref has superseded. Without this
# an amend-and-force-push — routine under the single-commit-per-branch policy —
# leaves the old run executing to completion, competing for runners with the
# run whose result anyone actually wants.
#
# Keyed on the ref, not the PR number, so pushes to release are covered too.
# That has a consequence worth knowing before debugging a cache miss: a
# cancelled run saves no cache. When several merges land on release in quick
# succession, only the surviving run writes the dist cache, so PRs opened in
# the gap miss and build from scratch. That is correct but slower — and it
# means a green run in that window is no evidence either way about the
# restore-and-stamp path. The cache step itself still runs on a miss; it finds
# no entry for the key and restores nothing, so the stamp step is skipped and
# nothing depending on a restored dist was exercised. A cache step that ran is
# not a cache that was restored.
# Least privilege for every job in this workflow.
#
# Without this block jobs inherit the repository default, which is
# `default_workflow_permissions: write` with `can_approve_pull_request_reviews:
# true` — so a build job that only checks out and runs tests holds a token that
# can push to the repository and approve pull requests. ci.yml was the only
# workflow here not declaring its own permissions; every other one does.
#
# The distribution was also backwards. `test` and `provider-safety-net` declared
# `contents: read`, but those are the 2-4 second aggregator jobs that run no
# code. Their shards — which install dependencies and execute the suites, and
# are the jobs where a compromised dependency would actually run — inherited the
# write-scoped default.
#
# This is the floor for the whole workflow. A job that genuinely needs more must
# declare it itself, which makes the exception visible in review rather than
# implicit in a repository setting nobody reads. Nothing here needs more today:
# no job pushes, tags, publishes or comments, and the single GITHUB_TOKEN
# consumer is `semantic-release --dry-run`, restricted to commit-analyzer and
# release-notes-generator.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check. Same reasoning as provider-safety-net below: `test` is
  # required by both protection layers AND is a `needs:` of
  # semantic-release-validation, so the name has to survive verbatim.
  test:
    needs: [test-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to have passed
        run: |
          result="${{ needs.test-shards.result }}"
          echo "shards result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::test shards did not all succeed (result=$result)"
            exit 1
          fi
          echo "All test shards passed."

  test-shards:
    strategy:
      fail-fast: false
      matrix:
        group: [lint, validate, types]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # ffmpeg is deliberately NOT installed in this workflow. Nothing these
      # jobs run needs it: no package script invokes it, and src/ shells out to
      # ffmpeg only at runtime (frame extraction, video merge, audio playback),
      # never during install, lint, typecheck, build or pack. provider-safety-net
      # has always built and run its suites without it.
      #
      # Removed after the apt install broke CI three ways in one day: a corrupt
      # published asset, a version pin that stopped resolving, and an Ubuntu
      # mirror returning Ign: for every index while apt sat for 14 minutes.
      # Because build-check is a required check, each of those blocked every
      # open pull request on a dependency none of these jobs use.
      #
      # If a job here ever runs a suite that genuinely exercises media, install
      # ffmpeg in THAT job only, and bound every wait (DPkg::Lock::Timeout,
      # Acquire::*::Timeout) plus a step timeout-minutes.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Check code formatting
        if: matrix.group == 'lint'
        run: |
          echo "🎨 Checking code formatting..."
          pnpm run format:check || {
            echo "❌ Formatting issues found!"
            echo "Run 'pnpm run format' locally to fix."
            exit 1
          }

      - name: Run linting
        if: matrix.group == 'lint'
        run: |
          echo "🔍 Running ESLint validation with controlled warning limits..."
          pnpm exec eslint src/ --max-warnings=300
          pnpm exec eslint test/continuous-test-suite*.ts test/zod-schema-test-function.ts --max-warnings=10
          # Everything else ESLint is configured to see, errors only.
          #
          # The two runs above cover src/ and the continuous-test-suite glob.
          # `eslint .` adds 46 files CI never linted, measured by diffing the
          # file lists rather than guessed:
          #
          #   eslint-rules 13 | test 25 (outside the glob) | docs-site 5
          #   tools 1 | landing 1 | .pnpmfile.cjs 1
          #
          # Note what this does NOT add. `scripts/**` is in the ignores list in
          # eslint.config.js, so no ESLint run covers it. And every custom
          # `neurolink/*` rule is enabled only for `files: ["src/**/*.ts", ...]`,
          # so those rules were never short of coverage — `eslint src/` already
          # gave them everything they inspect. The value here is the generic
          # rules reaching the lint rules themselves and the untested test files,
          # not rescuing a custom rule from a partial view.
          #
          # No warning ceiling on purpose: the scoped runs above own the warning
          # budgets, and duplicating one would let a limit be tightened in one
          # place and silently loosened in another.
          #
          # Free to add, measured: `pnpm exec eslint .` reports 0 errors / 56 warnings
          # and exits 0.
          pnpm exec eslint .

      - name: 🔒 Security & Environment Validation
        if: matrix.group == 'validate'
        run: |
          echo "🔍 Running build rule enforcement validations..."
          pnpm run validate:all

      # docs/api is 3236 generated files checked into the repo, and nothing kept
      # them current — release drifted 756 files behind its own source and still
      # carried five duplicate filenames. This regenerates and fails on any
      # difference, so the reference cannot silently rot again.
      #
      # Only possible because the output is now stable across commits. Typedoc
      # used to bake the current SHA into every "Defined in:" link and the
      # package version into every page header, so every commit rewrote all
      # 3224 files and a drift check would have failed on every PR. typedoc.json
      # pins gitRevision and drops includeVersion for exactly this reason —
      # changing either back re-breaks this gate.
      #
      # The prettier pass is part of the pipeline, not a tidy-up: docs/api is
      # not in .prettierignore and raw typedoc output fails format:check.
      # Costs about 12s.
      #
      # `git status --porcelain`, not `git diff`: typedoc runs with
      # cleanOutputDir, so a real drift can be a file it newly emits or stops
      # emitting, and only status reports untracked additions.
      - name: 📚 Check generated API docs are current
        if: matrix.group == 'validate'
        run: |
          echo "📚 Regenerating docs/api and checking for drift..."
          pnpm run docs:api
          pnpm exec prettier --write docs/api
          if [ -n "$(git status --porcelain docs/api)" ]; then
            echo "❌ docs/api is out of date with src/."
            echo "Run locally and commit the result:"
            echo "    pnpm run docs:api && pnpm exec prettier --write docs/api"
            git --no-pager diff --stat docs/api | tail -20
            exit 1
          fi
          echo "✅ docs/api matches the source it documents."

      - name: 🚫 Check banned dependencies
        if: matrix.group == 'validate'
        run: |
          echo "🔍 Verifying no banned packages leaked into production dependencies..."
          pnpm run check:deps

      # tools/ and scripts/ are excluded from the root tsconfig, so the files a
      # workflow actually depends on were never typechecked. That is how the
      # provider onboarding gate shipped reading a field that does not exist.
      - name: 🔎 Typecheck CI-critical scripts and tools
        if: matrix.group == 'types'
        run: pnpm run check:ci-scripts

      # test/ is excluded from tsconfig too, so `check` never looks at the
      # suites. A full typecheck there is 296 errors and a separate cleanup;
      # a parse check is free and catches the breakage that actually happens
      # when editing them — a stray backtick inside a generated-script template.
      - name: 🔎 Parse-check the test suites
        if: matrix.group == 'types'
        run: pnpm run check:test-parse

      # Reuse dist when every input to the build is byte-identical.
      #
      # There are deliberately NO restore-keys. A partial-prefix match would
      # serve a dist built from different sources, and a stale build that still
      # reports green is the precise failure this repo has been removing. An
      # exact hash miss just rebuilds, which costs what it costs today.
      # Only the `types` shard builds, so only it may participate in the
      # cache. Without this guard the lint and validate shards reach the
      # post-job save with no dist/ on disk — and an empty entry saved under
      # a valid key would make every later job restore nothing and skip the
      # build, which is worse than never caching at all.
      - name: Restore built dist
        id: dist-cache
        if: matrix.group == 'types'
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'svelte.config.js', 'scripts/build-browser.mjs', 'scripts/collapse-cli-lib-duplicate.mjs') }}

      # A cache HIT restores dist/ with the mtimes it was SAVED with, while
      # actions/checkout stamps src/ with checkout time — so the repo's
      # assertDistFresh guard reads a genuinely current dist as stale and kills
      # every suite that imports it. The key above hashes src/** and every
      # build input, so a hit proves dist matches this exact tree; re-stamping
      # its mtimes is truthful, not a freshness bypass.
      #
      # That truth DEPENDS on the key being exact: never add `restore-keys`
      # to the cache step above. A prefix match would restore a dist built
      # from DIFFERENT sources, and this touch would then make
      # assertDistFresh certify stale code as fresh — converting the guard's
      # loud, correct abort into silently testing the wrong build.
      - name: Stamp restored dist as fresh
        if: matrix.group == 'types' && steps.dist-cache.outputs.cache-hit == 'true'
        run: find dist -exec touch {} +

      - name: Build package
        if: matrix.group == 'types' && steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      # After the build, deliberately: these suites import ../dist/index.js, so
      # on an unbuilt tree every such import fails and cascades to ~769 errors.
      - name: 🔎 Typecheck tools/ and test/
        if: matrix.group == 'types'
        run: pnpm run check:tools-tests

      - name: Test CLI build
        if: matrix.group == 'types'
        run: |
          pnpm run build:cli
          node dist/cli/index.js --help

  # The required check. `provider-safety-net` is required by BOTH the ruleset
  # and classic branch protection, so the context name has to survive verbatim —
  # a matrix would rename it to "provider-safety-net (contract)" and every PR
  # would block on a required check that no longer reports. See the GH013 note
  # in CLAUDE.md for what a missing required context does to this branch.
  #
  # `if: always()` is load-bearing. Without it a failed shard makes this job
  # SKIPPED rather than failed, and GitHub can treat a skipped required check as
  # satisfied — the exact "green means nothing" failure this repo keeps hitting.
  # So it always runs and reads the shards' result explicitly.
  provider-safety-net:
    needs: [provider-safety-net-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to have passed
        run: |
          result="${{ needs.provider-safety-net-shards.result }}"
          echo "shards result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::provider-safety-net shards did not all succeed (result=$result)"
            exit 1
          fi
          echo "All provider-safety-net shards passed."

  # The work. Split by measured duration: test:providers-mocked alone is
  # 4m13s of this job's 10m14s; the remaining eight suites total roughly the
  # same. Two shards therefore halve it rather than leaving one long tail.
  provider-safety-net-shards:
    strategy:
      fail-fast: false
      matrix:
        group: [contract, rest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      # Reuse dist when every input to the build is byte-identical.
      #
      # There are deliberately NO restore-keys. A partial-prefix match would
      # serve a dist built from different sources, and a stale build that still
      # reports green is the precise failure this repo has been removing. An
      # exact hash miss just rebuilds, which costs what it costs today.
      - name: Restore built dist
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'svelte.config.js', 'scripts/build-browser.mjs', 'scripts/collapse-cli-lib-duplicate.mjs') }}

      # A cache HIT restores dist/ with the mtimes it was SAVED with, while
      # actions/checkout stamps src/ with checkout time — so the repo's
      # assertDistFresh guard reads a genuinely current dist as stale and kills
      # every suite that imports it. The key above hashes src/** and every
      # build input, so a hit proves dist matches this exact tree; re-stamping
      # its mtimes is truthful, not a freshness bypass.
      #
      # That truth DEPENDS on the key being exact: never add `restore-keys`
      # to the cache step above. A prefix match would restore a dist built
      # from DIFFERENT sources, and this touch would then make
      # assertDistFresh certify stale code as fresh — converting the guard's
      # loud, correct abort into silently testing the wrong build.
      - name: Stamp restored dist as fresh
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: find dist -exec touch {} +

      - name: Build package
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Mocked provider contract tests (no API keys required)
        if: matrix.group == 'contract'
        run: pnpm run test:providers-mocked

      - name: Provider structure tests (registry ↔ filesystem, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:provider-structure

      - name: Error classifier contract tests (TimeoutError classification per provider, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:error-classifier-contract

      - name: Bedrock inference-profile fallback (local HTTP/2 stand-in, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:bedrock-inference-profile

      - name: Bedrock loop characterization (local HTTP/2 stand-in, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:bedrock-loop-characterization

      - name: SageMaker streaming (local stand-in, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:sagemaker-streaming

      - name: Anthropic loop characterization (local SSE stand-in, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:anthropic-loop-characterization

      - name: AI Studio loop characterization (local SSE stand-in, no API keys required)
        if: matrix.group == 'rest'
        run: pnpm run test:aistudio-loop-characterization

      - name: 🧩 Provider Onboarding Completeness
        if: matrix.group == 'rest'
        run: pnpm run verify:provider-onboarding

  # REQUIRED. A red run here blocks the merge.
  #
  # This comment used to say the opposite — "advisory only … a red run here is
  # information, not a gate" — and it was correct when written. The branch
  # protection change it was waiting for has since been made, and nothing
  # updated the note, so the file spent that time telling anyone debugging a red
  # `security-suites` that they could ignore it. On the suites that drive zip
  # bombs, path traversal and XXE-shaped documents, that is the worst possible
  # thing to be wrong about.
  #
  # Where it is required is worth knowing, because the two protection layers
  # disagree and GitHub enforces their union:
  #
  #   classic branch protection   test · provider-safety-net · build-check ·
  #                               🔒 Single Commit Policy Validation · security-suites
  #   ruleset 11413189            the same four, WITHOUT security-suites
  #
  # So `gh api repos/juspay/neurolink/rulesets/11413189` reports four contexts
  # and no mention of this job — querying the ruleset alone still says it is
  # optional. Use `gh api repos/juspay/neurolink/branches/release/protection`,
  # or check both. CLAUDE.md's "Required status checks and the release bot"
  # section covers the same trap from the other direction.
  #
  # One real consequence of living only on the classic layer: that layer has
  # `enforce_admins: false`, so this is the one required check a repository
  # admin can bypass. The ruleset's four have `bypass_actors: []` and nobody can.
  #
  # A migration off classic protection would silently drop this check — the job
  # keeps running and keeps reporting green, so nothing looks different until
  # something red merges. Add the context to the ruleset first.
  #
  # The suites themselves were wired into `test:unit`, which no workflow ever
  # invoked, so before this job existed they had never executed on a pull
  # request at all.
  #
  # Both suites are credential-free by construction — they never call a model.
  security-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job runs on pull_request and executes code from the checkout.
          # actions/checkout persists GITHUB_TOKEN in .git/config by default and
          # nothing here needs authenticated git, so drop it.
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      # Reuse dist when every input to the build is byte-identical.
      #
      # There are deliberately NO restore-keys. A partial-prefix match would
      # serve a dist built from different sources, and a stale build that still
      # reports green is the precise failure this repo has been removing. An
      # exact hash miss just rebuilds, which costs what it costs today.
      - name: Restore built dist
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('src/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'svelte.config.js', 'scripts/build-browser.mjs', 'scripts/collapse-cli-lib-duplicate.mjs') }}

      # A cache HIT restores dist/ with the mtimes it was SAVED with, while
      # actions/checkout stamps src/ with checkout time — so the repo's
      # assertDistFresh guard reads a genuinely current dist as stale and kills
      # every suite that imports it. The key above hashes src/** and every
      # build input, so a hit proves dist matches this exact tree; re-stamping
      # its mtimes is truthful, not a freshness bypass.
      #
      # That truth DEPENDS on the key being exact: never add `restore-keys`
      # to the cache step above. A prefix match would restore a dist built
      # from DIFFERENT sources, and this touch would then make
      # assertDistFresh certify stale code as fresh — converting the guard's
      # loud, correct abort into silently testing the wrong build.
      - name: Stamp restored dist as fresh
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: find dist -exec touch {} +

      - name: Build package
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Archive security suite (zip bombs, traversal — no API keys required)
        run: pnpm run test:archive:security

      - name: Office document security suite (no API keys required)
        run: pnpm run test:office:security

      - name: Docs MCP server suite (no API keys required)
        run: pnpm run test:docs-mcp

      # The rest of test:unit. Nothing in CI has ever invoked test:unit, so 71
      # of the repo's 83 suite-running scripts never execute on a pull request
      # — the archive and office suites above were two instances of that, not
      # the whole of it.
      #
      # These are the credential-free ones. Measured with the entire environment
      # stripped (no .env, empty env): 654 assertions pass, 9 skip, exit 0, in
      # 87s total. So this is real coverage rather than a suite that goes green
      # by skipping, which is the failure mode worth guarding against here.
      #
      # test:model-not-found-retryable is deliberately absent: it is the one
      # member of test:unit that skips entirely without credentials, so running
      # it here would add a step that can only ever no-op.
      # test:bugfixes was held out of CI until now. Its four FileDetector
      # failures were not flaky and not environmental: getGlobalDispatcher()
      # returns Node's BUILT-IN undici, whose major tracks the runtime, and the
      # composed result was passed to npm undici 7's request(). On Node 22
      # (built-in undici 6) that throws "invalid onError method"; on Node 24
      # (built-in 7) it does not. Node 22 is this package's engines floor, so
      # consumers hit it too — see src/lib/utils/redirectDispatcher.ts.
      #
      # Kept here as a note because the runner is where it will resurface: if
      # this step starts failing on FileDetector again after a Node or undici
      # bump, that dispatcher-major check is the first place to look.
      - name: Credential-free suites (the rest of test:unit)
        run: |
          pnpm run test:bugfixes
          pnpm run test:mcp:infra
          pnpm run test:mcp:spans
          pnpm run test:tool-routing
          pnpm run test:tool-routing-cli
          pnpm run test:tool-dedup
          pnpm run test:model-pool
          pnpm run test:tool-routing-semantic
          pnpm run test:mcp-result-cache
          pnpm run test:vector-chroma
          pnpm run test:vector-pgvector
          pnpm run test:vector-pinecone
          pnpm run test:provider-wiring

