name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # ffmpeg is deliberately NOT installed in this workflow. Nothing these
      # jobs run needs it: no package script invokes it, and src/ shells out to
      # ffmpeg only at runtime (frame extraction, video merge, audio playback),
      # never during install, lint, typecheck, build or pack. provider-safety-net
      # has always built and run its suites without it.
      #
      # Removed after the apt install broke CI three ways in one day: a corrupt
      # published asset, a version pin that stopped resolving, and an Ubuntu
      # mirror returning Ign: for every index while apt sat for 14 minutes.
      # Because build-check is a required check, each of those blocked every
      # open pull request on a dependency none of these jobs use.
      #
      # If a job here ever runs a suite that genuinely exercises media, install
      # ffmpeg in THAT job only, and bound every wait (DPkg::Lock::Timeout,
      # Acquire::*::Timeout) plus a step timeout-minutes.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Check code formatting
        run: |
          echo "🎨 Checking code formatting..."
          pnpm run format:check || {
            echo "❌ Formatting issues found!"
            echo "Run 'pnpm run format' locally to fix."
            exit 1
          }

      - name: Run linting
        run: |
          echo "🔍 Running ESLint validation with controlled warning limits..."
          npx eslint src/ --max-warnings=300
          npx eslint test/continuous-test-suite*.ts test/zod-schema-test-function.ts --max-warnings=10

      - name: 🔒 Security & Environment Validation
        run: |
          echo "🔍 Running build rule enforcement validations..."
          pnpm run validate:all

      # docs/api is 3236 generated files checked into the repo, and nothing kept
      # them current — release drifted 756 files behind its own source and still
      # carried five duplicate filenames. This regenerates and fails on any
      # difference, so the reference cannot silently rot again.
      #
      # Only possible because the output is now stable across commits. Typedoc
      # used to bake the current SHA into every "Defined in:" link and the
      # package version into every page header, so every commit rewrote all
      # 3224 files and a drift check would have failed on every PR. typedoc.json
      # pins gitRevision and drops includeVersion for exactly this reason —
      # changing either back re-breaks this gate.
      #
      # The prettier pass is part of the pipeline, not a tidy-up: docs/api is
      # not in .prettierignore and raw typedoc output fails format:check.
      # Costs about 12s.
      #
      # `git status --porcelain`, not `git diff`: typedoc runs with
      # cleanOutputDir, so a real drift can be a file it newly emits or stops
      # emitting, and only status reports untracked additions.
      - name: 📚 Check generated API docs are current
        run: |
          echo "📚 Regenerating docs/api and checking for drift..."
          pnpm run docs:api
          npx prettier --write docs/api
          if [ -n "$(git status --porcelain docs/api)" ]; then
            echo "❌ docs/api is out of date with src/."
            echo "Run locally and commit the result:"
            echo "    pnpm run docs:api && npx prettier --write docs/api"
            git --no-pager diff --stat docs/api | tail -20
            exit 1
          fi
          echo "✅ docs/api matches the source it documents."

      - name: 🚫 Check banned dependencies
        run: |
          echo "🔍 Verifying no banned packages leaked into production dependencies..."
          pnpm run check:deps

      # tools/ and scripts/ are excluded from the root tsconfig, so the files a
      # workflow actually depends on were never typechecked. That is how the
      # provider onboarding gate shipped reading a field that does not exist.
      - name: 🔎 Typecheck CI-critical scripts and tools
        run: pnpm run check:ci-scripts

      # test/ is excluded from tsconfig too, so `check` never looks at the
      # suites. A full typecheck there is 296 errors and a separate cleanup;
      # a parse check is free and catches the breakage that actually happens
      # when editing them — a stray backtick inside a generated-script template.
      - name: 🔎 Parse-check the test suites
        run: pnpm run check:test-parse

      - name: Build package
        run: pnpm run build

      # After the build, deliberately: these suites import ../dist/index.js, so
      # on an unbuilt tree every such import fails and cascades to ~769 errors.
      - name: 🔎 Typecheck tools/ and test/
        run: pnpm run check:tools-tests

      - name: Test CLI build
        run: |
          pnpm run build:cli
          node dist/cli/index.js --help

  provider-safety-net:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Build package
        run: pnpm run build

      - name: Mocked provider contract tests (no API keys required)
        run: pnpm run test:providers-mocked

      - name: Provider structure tests (registry ↔ filesystem, no API keys required)
        run: pnpm run test:provider-structure

      - name: Error classifier contract tests (TimeoutError classification per provider, no API keys required)
        run: pnpm run test:error-classifier-contract

      - name: Bedrock inference-profile fallback (local HTTP/2 stand-in, no API keys required)
        run: pnpm run test:bedrock-inference-profile

      - name: Bedrock loop characterization (local HTTP/2 stand-in, no API keys required)
        run: pnpm run test:bedrock-loop-characterization

      - name: SageMaker streaming (local stand-in, no API keys required)
        run: pnpm run test:sagemaker-streaming

      - name: Anthropic loop characterization (local SSE stand-in, no API keys required)
        run: pnpm run test:anthropic-loop-characterization

      - name: AI Studio loop characterization (local SSE stand-in, no API keys required)
        run: pnpm run test:aistudio-loop-characterization

      - name: 🧩 Provider Onboarding Completeness
        run: pnpm run verify:provider-onboarding

  # Advisory only — deliberately NOT in the required-checks list.
  #
  # The archive and office security suites drive real malicious inputs (zip
  # bombs, path traversal, XXE-shaped office documents) through the public
  # surface. They were wired into `test:unit`, but nothing in CI has ever run
  # `test:unit`, so they had never executed on a pull request.
  #
  # Running them here makes the result visible on every PR. Making them
  # *blocking* is a separate, deliberate step: it needs the check added to the
  # branch protection rule on `release`, which is a repository settings change
  # and cannot be done from this file. Until someone makes that change, a red
  # run here is information, not a gate.
  #
  # Both suites are credential-free by construction — they never call a model.
  security-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job runs on pull_request and executes code from the checkout.
          # actions/checkout persists GITHUB_TOKEN in .git/config by default and
          # nothing here needs authenticated git, so drop it.
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Build package
        run: pnpm run build

      - name: Archive security suite (zip bombs, traversal — no API keys required)
        run: pnpm run test:archive:security

      - name: Office document security suite (no API keys required)
        run: pnpm run test:office:security

      - name: Docs MCP server suite (no API keys required)
        run: pnpm run test:docs-mcp

      # The rest of test:unit. Nothing in CI has ever invoked test:unit, so 71
      # of the repo's 83 suite-running scripts never execute on a pull request
      # — the archive and office suites above were two instances of that, not
      # the whole of it.
      #
      # These are the credential-free ones. Measured with the entire environment
      # stripped (no .env, empty env): 654 assertions pass, 9 skip, exit 0, in
      # 87s total. So this is real coverage rather than a suite that goes green
      # by skipping, which is the failure mode worth guarding against here.
      #
      # test:model-not-found-retryable is deliberately absent: it is the one
      # member of test:unit that skips entirely without credentials, so running
      # it here would add a step that can only ever no-op.
      # test:bugfixes was held out of CI until now. Its four FileDetector
      # failures were not flaky and not environmental: getGlobalDispatcher()
      # returns Node's BUILT-IN undici, whose major tracks the runtime, and the
      # composed result was passed to npm undici 7's request(). On Node 22
      # (built-in undici 6) that throws "invalid onError method"; on Node 24
      # (built-in 7) it does not. Node 22 is this package's engines floor, so
      # consumers hit it too — see src/lib/utils/redirectDispatcher.ts.
      #
      # Kept here as a note because the runner is where it will resurface: if
      # this step starts failing on FileDetector again after a Node or undici
      # bump, that dispatcher-major check is the first place to look.
      - name: Credential-free suites (the rest of test:unit)
        run: |
          pnpm run test:bugfixes
          pnpm run test:mcp:infra
          pnpm run test:mcp:spans
          pnpm run test:tool-routing
          pnpm run test:tool-routing-cli
          pnpm run test:tool-dedup
          pnpm run test:model-pool
          pnpm run test:tool-routing-semantic
          pnpm run test:mcp-result-cache
          pnpm run test:vector-chroma
          pnpm run test:vector-pgvector
          pnpm run test:vector-pinecone
          pnpm run test:provider-wiring

