name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # Installed from the runner's package index rather than a third-party
      # action that downloads release assets from another repository. That
      # action has broken this pipeline twice: first when the 8.1 asset was
      # published corrupt, then again when the 7.1 pin added to work around
      # it stopped resolving. Neither failure was caused by anything in this
      # repository, and both blocked every open pull request. apt carries a
      # version new enough for what the suites exercise, and it cannot be
      # invalidated by an upstream release being moved or rebuilt.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          # Runners boot with unattended-upgrades holding the dpkg lock, and a
          # plain apt-get waits on that lock forever. On 2026-08-18 this step
          # sat in_progress for 90 minutes on two open PRs, leaving the quality
          # gate permanently "pending" with nothing to re-run against. Bound
          # every wait so a contended lock fails fast, and let the step
          # deadline catch anything the bounds miss.
          sudo systemctl stop unattended-upgrades.service >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 update && break
            echo "apt-get update failed (attempt ${attempt}/3), retrying in 5s"
            sleep 5
          done
          sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 \
            install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg installation
        run: |
          echo "🎬 Verifying ffmpeg installation..."
          ffmpeg -version || {
            echo "❌ ffmpeg installation failed!"
            echo "apt-get install ffmpeg did not produce a working binary."
            exit 1
          }
          echo "✅ ffmpeg installed successfully"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Check code formatting
        run: |
          echo "🎨 Checking code formatting..."
          pnpm run format:check || {
            echo "❌ Formatting issues found!"
            echo "Run 'pnpm run format' locally to fix."
            exit 1
          }

      - name: Run linting
        run: |
          echo "🔍 Running ESLint validation with controlled warning limits..."
          npx eslint src/ --max-warnings=300
          npx eslint test/continuous-test-suite*.ts test/zod-schema-test-function.ts --max-warnings=10

      - name: 🔒 Security & Environment Validation
        run: |
          echo "🔍 Running build rule enforcement validations..."
          pnpm run validate:all

      - name: Build package
        run: pnpm run build

      - name: Test CLI build
        run: |
          pnpm run build:cli
          node dist/cli/index.js --help

  provider-safety-net:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: |
          echo "🔄 Running SvelteKit sync to generate TypeScript configs..."
          pnpm exec svelte-kit sync

      - name: Build package
        run: pnpm run build

      - name: Mocked provider contract tests (no API keys required)
        run: pnpm run test:providers-mocked

      - name: Provider structure tests (registry ↔ filesystem, no API keys required)
        run: pnpm run test:provider-structure

      - name: Error classifier contract tests (TimeoutError classification per provider, no API keys required)
        run: pnpm run test:error-classifier-contract

