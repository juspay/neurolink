# Yama learn — post-merge knowledge update, delivered as a pull request.
#
# The merge event is the only trigger that reliably identifies which pull
# request merged. Learn runs ONE agent turn (.yama/config.json `learnPrompt`)
# that reads the merged PR's discussion and distills durable learnings into the
# COMMITTED memory database at .yama/memory/hippocampus.sqlite — read by every
# later review — then yama's deterministic write path commits exactly that file
# locally. This workflow pushes that commit to a `yama/memory-<pr>-<run>` branch
# and opens a pull request against `release`; it never pushes to `release`.
#
# TRUST BOUNDARY: what learn writes is DERIVED FROM PULL-REQUEST DISCUSSION,
# and anyone who can comment on a pull request that later merges can influence
# that text. The memory it commits is read by every later review as this
# repository's own settled knowledge, so a memory change is a change to the
# review rulebook and gets the same path as any other change: a pull request,
# CI, and a human review. An earlier version of this file asked for a branch
# protection bypass so the bot could push to `release` directly with [skip ci];
# that request is withdrawn and must not be granted — it would let an external
# commenter's text land on the default branch with no checks run.
#
# Loop guards: the merged-and-human-authored refusal below, and the pull request
# this opens is authored by github-actions[bot], which the refusal excludes.

name: Yama learn

on:
  # Chained AFTER the release workflow on the default branch: the release run
  # has finished before learn is even queued.
  workflow_run:
    workflows: ["Release and Publish"]
    types: [completed]

  # Recovery lever: a learn that failed for an environmental reason can be
  # re-run for the same pull request. The merged-and-human guard is re-checked
  # below from GitHub's own record, so a dispatch cannot aim the write job at
  # an unmerged or bot-authored pull request.
  workflow_dispatch:
    inputs:
      pr:
        description: "Merged pull request number to learn from"
        required: true
        type: string

# Serialised: two learn runs would each start from the same memory and the
# second pull request would conflict with the first.
concurrency:
  group: yama-learn
  cancel-in-progress: false

# `contents: write` is for the push to the yama/memory-* branch only — `release`
# is protected and nothing here targets it. `pull-requests: write` opens the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  learn:
    # Only a MERGED pull request teaches anything. A closed-unmerged one was
    # rejected, and learning from it would record conventions nobody adopted.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve the pull request this run learns from
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_PR:-}" ]; then
            PR="$DISPATCH_PR"
          else
            # Which pull request produced this commit. Works for squash, merge
            # and rebase merges alike: GitHub associates the resulting commit
            # with the pull request it came from.
            PR=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                   --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | reverse | .[0].number // empty')
          fi
          if [ -z "${PR:-}" ]; then
            echo "::notice::No merged pull request behind ${HEAD_SHA} — a direct push has no discussion to learn from."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::'${PR}' is not a pull request number"; exit 1; }
          merged=$(gh api "repos/${REPOSITORY}/pulls/${PR}" --jq '.merged')
          author=$(gh api "repos/${REPOSITORY}/pulls/${PR}" --jq '.user.login')
          [ "$merged" = "true" ] || { echo "::error::PR #${PR} is not merged"; exit 1; }
          [ "$author" != "github-actions[bot]" ] || { echo "::error::PR #${PR} is bot-authored — refusing the self-feed loop"; exit 1; }
          echo "Learning from PR #${PR} (merged, authored by ${author})."
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.target.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Named, not detached: learn refuses to commit on a detached HEAD.
          ref: ${{ github.event.repository.default_branch }}
          # No credential in .git/config while the agent and its dependency tree
          # run; the push step below supplies the token for that one command.
          persist-credentials: false

      - name: Setup Node.js
        if: steps.target.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Set the commit identity
        if: steps.target.outputs.run == 'true'
        # Yama shells out to plain `git commit`; it never passes an author of
        # its own — the identity a repository's agent commits under is the
        # repository's decision, not the tool's.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Learn
        if: steps.target.outputs.run == 'true'
        id: learn
        # One agent turn reads the merged pull request through the github MCP
        # server and distills learnings into memory/hippocampus.sqlite; yama
        # then waits for the memory write to land, checkpoints the WAL, stages
        # exactly that file, reads the staged set back, and commits LOCALLY
        # (.yama/config.json `learn.push` is false). A refused or failed write
        # exits non-zero, so a silent no-op cannot pass for a successful learn.
        #
        # Exact version, same pin as yama-review.yml; bump both together.
        env:
          YAMA_VERSION: "6.1.1"
          YAMA_GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        working-directory: .yama
        run: |
          before="$(git rev-parse HEAD)"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          npx --yes "@juspay/yama@${YAMA_VERSION}" learn "pr=$PR_NUMBER" 2>&1 | tee learn-run.log
          exit "${PIPESTATUS[0]}"

      - name: Open a pull request with the memory change
        if: steps.target.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          BEFORE: ${{ steps.learn.outputs.before }}
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          after="$(git rev-parse HEAD)"
          if [ "$after" = "$BEFORE" ]; then
            echo "::notice::learn committed nothing for PR #${PR_NUMBER} (no durable learnings); no pull request to open."
            exit 0
          fi
          # Exactly one commit, touching exactly the memory database. Anything
          # else means the agent wrote outside its lane and must not be proposed.
          count="$(git rev-list --count "${BEFORE}..${after}")"
          [ "$count" = "1" ] || { echo "::error::learn produced ${count} commits; expected exactly 1"; exit 1; }
          changed="$(git diff --name-only "${BEFORE}" "${after}")"
          [ "$changed" = ".yama/memory/hippocampus.sqlite" ] || {
            echo "::error::learn changed files other than the memory database:"; echo "$changed"; exit 1; }
          # The commit message is rewritten here so no CI-skip directive from the
          # tool's defaults can reach the branch (GitHub honours [skip ci] in the
          # body as well as the subject, and a PR whose head carries one never
          # gets its required checks).
          git commit --amend --quiet -m "chore(yama): learn from #${PR_NUMBER}" \
            -m "Memory update distilled from the discussion on #${PR_NUMBER} by .github/workflows/yama-learn.yml (run ${RUN_ID}). Review it as a change to the review rulebook."
          branch="yama/memory-${PR_NUMBER}-${RUN_ID}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${branch}"
          gh pr create --base "$BASE" --head "$branch" \
            --title "chore(yama): learn from #${PR_NUMBER}" \
            --label "automated" \
            --body "$(printf '%s\n' \
              "Yama's post-merge retrospective of #${PR_NUMBER} wrote new learnings into \`.yama/memory/hippocampus.sqlite\`." \
              "" \
              "Every later automated review reads this file as settled project knowledge, and its content is derived from the pull-request discussion — text anyone with a GitHub account could have written. Review it as a change to the review rulebook: the run log is attached to run ${RUN_ID} as \`yama-learn-${PR_NUMBER}-${RUN_ID}\`." \
              "" \
              "Opened by .github/workflows/yama-learn.yml.")"

      - name: Archive the run log
        # A run that failed still logged what it did, and that is what you read.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yama-learn-${{ steps.target.outputs.pr || 'none' }}-${{ github.run_id }}
          path: .yama/learn-run.log
          retention-days: 14
