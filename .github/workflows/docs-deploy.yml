name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths:
      - "docs-site/**"
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"

# Read-only by default; each job declares what it writes.
permissions:
  contents: read

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.4"

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write # actions/configure-pages
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No caches in a workflow that deploys: a cache written by another
          # run would flow into the published site.
          package-manager-cache: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync docs content
        run: pnpm run sync-docs

      - name: Build LLMs.txt
        run: pnpm run build:llms-txt

      - name: Build documentation
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}

      - name: Push search index to Algolia
        if: ${{ env.ALGOLIA_APP_ID != '' && env.ALGOLIA_ADMIN_API_KEY != '' }}
        run: node scripts/push-algolia-index.js
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
