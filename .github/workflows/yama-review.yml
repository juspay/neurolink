# Yama PR Review — AI code review on every PR targeting the `release` branch.
#
# Yama v6 (the prompts-driven reviewer): config lives in ./.yama/ (config.json +
# MCP.json + prompts.json + skills/), reviewed like any code. The reviewer runs
# .yama/prompts.json top to bottom in one session — review and post, then
# validate what landed — reading code from the LOCAL checkout and recalling
# earlier reviews' learnings from the COMMITTED memory database at
# .yama/memory/hippocampus.sqlite (updated post-merge by yama-learn.yml).
#
# Verdict contract (v6): the verdict is DELIVERED as the pull request's review
# state (approve / request-changes), where reviewers read it. This required
# "Yama PR Review" check goes red only when the run itself BREAKS — a failed
# prompt, config error, crash. Green means "review delivered", not "approved";
# merge gating stays with branch protection and human review.
#
# Required repository secrets:
#   YAMA_GITHUB_TOKEN : real PAT (PRs read/write + contents read) — the hosted
#                       GitHub MCP endpoint rejects the ephemeral Actions token.
#   LITELLM_BASE_URL / LITELLM_API_KEY : the gateway the models in
#                       .yama/config.json live on.
#
# Fork PRs (no secrets) pass cleanly so the required check never deadlocks.

name: Yama PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [release]

concurrency:
  group: yama-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  yama-review:
    # This job name IS the required status-check context in branch protection —
    # keep the two in sync (.github/settings.yml).
    name: Yama PR Review
    runs-on: ubuntu-latest
    # Two prompts, each bounded by .yama/config.json's turnTimeoutMs (40m), so a
    # slow model is cut off by the agent — which reports honestly — rather than
    # by the runner, which kills the job and reports nothing.
    timeout-minutes: 120

    steps:
      - name: Preflight (fork + secrets)
        id: gate
        env:
          PAT: ${{ secrets.YAMA_GITHUB_TOKEN }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$IS_SAME_REPO" != "true" ]; then
            echo "::notice::Fork PR — secrets unavailable; skipping Yama review (check passes)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PAT" ] || [ -z "$LITELLM_BASE_URL" ] || [ -z "$LITELLM_API_KEY" ]; then
            echo "::notice::Missing YAMA_GITHUB_TOKEN / LITELLM_* secrets; skipping Yama review (check passes)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          # The reviewer reads code from disk; full history keeps base/head
          # diffs correct for the graph server and git-based inspection.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv (code-review-graph server)
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Pre-build the code graph
        if: steps.gate.outputs.run == 'true'
        # Builds the graph store at the repo root, which also warms uvx's
        # package cache. Non-fatal: the review runs without graph context.
        run: |
          uvx --from code-review-graph==2.3.7 code-review-graph build \
            || echo "::warning::graph build failed (non-fatal; the review runs without graph context)"

      - name: Yama review
        if: steps.gate.outputs.run == 'true'
        # Pinned to the 6.x major: this wiring is the v6 config layout, and the
        # learn command this repository chains on post-merge needs >= 6.1.0.
        #
        # Floor raised to 6.1.1: its NeuroLink dependency (>= 12.7.8) observes a
        # stdio MCP server dying mid-review and restarts it (juspay/neurolink
        # #1610). On the previous floor the code-review-graph server could die
        # silently and every later call failed with "Not connected".
        env:
          YAMA_GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          # Branch names are attacker-controllable; they go through env, never
          # straight into the shell.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        working-directory: .yama
        run: |
          npx --yes @juspay/yama@^6.1.1 run "pr=$PR_NUMBER" "branch=$HEAD_REF" 2>&1 | tee review-run.log
          exit "${PIPESTATUS[0]}"

      - name: Archive the run log
        # A run that failed still logged what it did, and that is what you read.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yama-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: .yama/review-run.log
          retention-days: 14
