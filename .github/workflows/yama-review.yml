# Yama PR Review — AI code review on every PR targeting the `release` branch.
#
# Powered by the published @juspay/yama action (https://github.com/juspay/yama),
# run "the same way" as Yama's own self-review: LiteLLM provider, review-only,
# fork-safe. The review RULES come from THIS repo — Yama auto-loads CLAUDE.md and
# CONTRIBUTING.md, and the focus areas / blocking criteria / MCP servers live in
# ./.yama/config.yaml (the v3 config location; passed explicitly via
# `config-path` so the reviewed checkout can never swap in a different config).
#
# v3 additions (mirroring Yama's own yama-self-review.yml and curator's setup):
#   • code-review-graph MCP (uvx) for out-of-diff impact analysis — uv is
#     installed and the graph pre-built below; both are non-fatal.
#   • Cross-run review state persisted as a GitHub artifact per PR, so
#     re-reviews are incremental (no duplicate comments, fixed findings get
#     resolved).
#   • Per-run review report uploaded as an artifact for debugging.
#
# This is a REQUIRED status check (context "Yama PR Review", wired in
# .github/settings.yml). It FAILS — and blocks merge — only when Yama returns a
# BLOCKED verdict (per .yama/config.yaml `blockingCriteria`) or the review cannot
# complete. Ordinary review comments / CHANGES_REQUESTED do not fail the check.
#
# Stale-verdict hygiene: Yama's reviews pin to the commit they reviewed, and a
# CHANGES_REQUESTED from a superseded head keeps reviewDecision red even after
# the findings were fixed and a fresh review ran — historically that verdict
# could only be cleared by a human dismissing it (#1509, #1513, #1542). The
# "Dismiss superseded verdicts" step below clears the bot's OWN
# CHANGES_REQUESTED reviews from older commits, but only after this run
# produced a verdict for the current head, only when the run was not
# cancelled, and only while the PR head still matches the head this run
# reviewed — stale signal is only ever replaced, never removed, and a
# cancelled or superseded run never dismisses anything.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   YAMA_GITHUB_TOKEN : a REAL GitHub PAT — fine-grained with
#                       "Pull requests: Read and write" + "Contents: Read"
#                       scoped to this repo, OR a classic PAT with `repo`.
#                       The hosted GitHub MCP endpoint rejects the ephemeral
#                       Actions GITHUB_TOKEN, so this is mandatory.
#   LITELLM_BASE_URL  : LiteLLM proxy base URL (must be reachable from
#                       GitHub-hosted runners).
#   LITELLM_API_KEY   : LiteLLM proxy API key.
#
# Fork PRs (which cannot read secrets) and runs with missing secrets are skipped
# cleanly — the check passes so it never deadlocks merges.

name: Yama PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [release]

concurrency:
  group: yama-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  yama-review:
    # This job name IS the required status-check context referenced by branch
    # protection in .github/settings.yml — keep the two in sync.
    name: Yama PR Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Needed to download the previous run's review-state artifact.
      actions: read
    steps:
      # Decide whether we can run. A required check must always report a
      # conclusion, so when it can't run (fork / missing secrets) we PASS
      # instead of skipping, to avoid blocking merges forever.
      - name: Preflight (fork + secrets)
        id: gate
        env:
          PAT: ${{ secrets.YAMA_GITHUB_TOKEN }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$IS_SAME_REPO" != "true" ]; then
            echo "::notice::Fork PR — repository secrets are unavailable; skipping Yama review (check passes)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PAT" ] || [ -z "$LITELLM_BASE_URL" ] || [ -z "$LITELLM_API_KEY" ]; then
            echo "::notice::Missing YAMA_GITHUB_TOKEN / LITELLM_BASE_URL / LITELLM_API_KEY; skipping Yama review (check passes)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Yama authenticates with its own PAT; don't leave the ephemeral
          # Actions token in .git/config.
          persist-credentials: false

      # The code-review-graph MCP server (declared in .yama/config.yaml)
      # launches via `uvx`, so `uv` must be on PATH before the review runs.
      # The composite action inherits the runner PATH.
      - name: Set up uv (for the code-review-graph MCP server)
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Pre-build the tree-sitter code graph so the reviewer has out-of-diff
      # context (blast radius, callers/dependents, flows) ready. Non-fatal:
      # on any failure Yama reviews without graph tools (its registration is
      # non-fatal too). Same version pin as .yama/config.yaml.
      - name: Pre-build code-review-graph
        if: steps.gate.outputs.run == 'true'
        run: |
          uvx --from code-review-graph==2.3.7 code-review-graph build \
            || echo "::warning::code-review-graph build failed (non-fatal, review runs without graph context)"

      # Cross-run review state (github-artifact store): restore the newest
      # state artifact for this PR so the review is incremental — previously
      # posted findings are never duplicated, fixed ones get resolved.
      - name: Restore review state
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Fully non-fatal: state is an optimization, and this is a REQUIRED
        # check — an expired artifact, rate limit, or transient API error must
        # start a fresh review, never fail the job before the review runs.
        run: |
          set -euo pipefail
          NAME="yama-state-pr-${PR}"
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty' 2>/dev/null || true)"
          if [ -n "${ART_ID}" ] && [ "${ART_ID}" != "null" ]; then
            mkdir -p .yama/state
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/yama-state.zip \
               && unzip -o /tmp/yama-state.zip -d .yama/state; then
              echo "Restored ${NAME}"
            else
              echo "State artifact unavailable or unreadable — starting fresh"
            fi
          else
            echo "No previous state artifact — first review of this PR"
          fi

      # The Yama action pins pnpm 10.14.0 via pnpm/action-setup, but this repo's
      # package.json declares "packageManager": "pnpm@10.15.1". pnpm/action-setup
      # aborts when both are present and differ. Temporarily drop the field so the
      # action uses its own pinned pnpm; it builds in its own directory and reviews
      # the PR via the GitHub API (not the local tree), so this is invisible to the
      # review. Restored right after. (Durable fix belongs in juspay/yama's
      # action.yml — e.g. set package_json_file to the action's own package.json.)
      - name: Work around pnpm/action-setup version clash
        if: steps.gate.outputs.run == 'true'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.packageManager;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Yama Review
        if: steps.gate.outputs.run == 'true'
        id: yama
        # Don't auto-fail the job on the action's exit code — the next step maps
        # the verdict to the check result explicitly.
        continue-on-error: true
        # External consumer → published action, pinned to an immutable commit
        # SHA (a tag can be moved; the SHA cannot).
        #
        # v3.0.2: the v3 pipeline — config-driven MCP (mcpServers.servers in
        # .yama/config.yaml; the legacy flat shape is REJECTED at startup),
        # agentic review harness with the submit_review verification gate,
        # cross-run state, structured verdicts, and no default review wall
        # clock (bounded by loop.maxSteps instead).
        #
        # When bumping, keep the trailing tag comment in sync with the SHA.
        uses: juspay/yama@087e7c67952008da7f5f2fd8fd669fed68220b11 # v3.0.2
        with:
          github-token: ${{ secrets.YAMA_GITHUB_TOKEN }}
          ai-provider: litellm
          # Model alias on the LiteLLM gateway the LITELLM_* secrets point at
          # (grid.breezehq.dev). The gateway exposes general / general-fast /
          # coder; the old private-large alias no longer exists there.
          ai-model: general-fast
          # Explore/verification subagents run on the SAME model as the main
          # review (this is also the action's default when omitted — set
          # explicitly so the choice is visible).
          explore-model: general-fast
          litellm-base-url: ${{ secrets.LITELLM_BASE_URL }}
          litellm-api-key: ${{ secrets.LITELLM_API_KEY }}
          config-path: .yama/config.yaml
          # Review only — post inline comments + a verdict; never rewrite the PR
          # description.
          skip-description-enhance: "true"

      - name: Enforce verdict
        if: steps.gate.outputs.run == 'true'
        env:
          DECISION: ${{ steps.yama.outputs.decision }}
          OUTCOME: ${{ steps.yama.outcome }}
        run: |
          echo "Yama decision: ${DECISION:-<none>} (action outcome: ${OUTCOME})"
          # No verdict = no review, regardless of the action's exit code. The
          # old gate only failed when the ACTION also failed, and then defaulted
          # an empty verdict to APPROVED — so a run whose every model call died
          # on provider quota exited 0, produced no verdict, and the check went
          # green having reviewed nothing. A green review check must mean a
          # review happened; fail and re-run to retry.
          if [ -z "$DECISION" ]; then
            echo "::error::Yama produced no verdict — the review did not complete (infrastructure or quota failure, not a code judgement). Re-run this job to retry."
            exit 1
          fi
          if [ "$DECISION" = "BLOCKED" ]; then
            echo "::error::Yama BLOCKED this PR. Resolve the blocking issues flagged in the review, then push an update."
            exit 1
          fi
          echo "✅ Yama review passed (decision=${DECISION})."

      # A review pins to the commit it reviewed. Once THIS run has produced a
      # verdict for the current head, any CHANGES_REQUESTED the bot posted on
      # an older head is superseded — but GitHub keeps it in reviewDecision
      # until someone dismisses it, and the concurrency setup means the run
      # that would have replaced it can end up cancelled and un-rerunnable.
      # Dismiss the bot's own stale verdicts here. Guarded on a non-empty
      # decision so a failed review never deletes the only signal; uses
      # !cancelled() — not always() — so a run cancelled by a newer push
      # never dismisses anything (that push's own run owns dismissal), while
      # a BLOCKED verdict (which exits the enforce step non-zero) still
      # counts as a fresh verdict for the current head.
      - name: Dismiss superseded verdicts
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.yama.outputs.decision != '' }}
        env:
          GH_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Fully non-fatal: dismissal is hygiene, not the review. Any API
        # failure leaves the stale verdict for a human, same as before.
        run: |
          set -uo pipefail
          # Belt to !cancelled()'s braces: if the PR head has already moved
          # past the head this run reviewed, a newer run owns dismissal —
          # dismissing here could remove the newer head's own fresh verdict.
          LIVE_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null)" || { echo "::warning::Could not read the live PR head; skipping stale-verdict dismissal."; exit 0; }
          if [ "${LIVE_HEAD}" != "${HEAD_SHA}" ]; then
            echo "PR head moved (${HEAD_SHA} -> ${LIVE_HEAD}) — the newer run owns dismissal; skipping."
            exit 0
          fi
          ME="$(gh api user --jq .login 2>/dev/null)" || { echo "::warning::Could not resolve the bot login; skipping stale-verdict dismissal."; exit 0; }
          STALE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate \
            --jq ".[] | select(.user.login == \"${ME}\" and .state == \"CHANGES_REQUESTED\" and .commit_id != \"${HEAD_SHA}\") | .id" 2>/dev/null)" || { echo "::warning::Could not list reviews; skipping stale-verdict dismissal."; exit 0; }
          if [ -z "${STALE}" ]; then
            echo "No stale ${ME} verdicts to dismiss."
            exit 0
          fi
          for RID in ${STALE}; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews/${RID}/dismissals" \
                 -f message="Superseded — the head moved to ${HEAD_SHA} and a fresh Yama review ran on it." >/dev/null 2>&1; then
              echo "Dismissed stale review ${RID}."
            else
              echo "::warning::Could not dismiss stale review ${RID} (left for a human)."
            fi
          done

      # Persist review state for the next push on this PR (incremental review).
      - name: Save review state
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yama-state-pr-${{ github.event.pull_request.number }}
          path: .yama/state/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

      # Per-run review report (markdown + JSON) for debugging what the reviewer
      # explored, which findings the gate accepted/rejected, and the verdict.
      - name: Upload review report
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yama-report-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          path: .yama/reports/
          if-no-files-found: ignore
          retention-days: 14

      # Undo the temporary packageManager edit (no-op if it was never applied).
      - name: Restore package.json
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: git checkout -- package.json || true
