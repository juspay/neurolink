name: Package Consumer

# Not a required check, and it must stay that way: it builds the package, packs
# it, and then installs the tarball with its thousands of modules once per case,
# each in a fresh directory, with the npm registry in the loop. That is far too
# slow and too network-dependent for `test` or `provider-safety-net`, which gate
# every pull request. Do not add its name to branch protection or to a ruleset.
#
# What it answers is whether the PACKED package type-checks for a consumer with
# `strict` on and `skipLibCheck` off, across @types/node 22 and latest, React 18
# and 19, and an install that omits the optional dependencies. See the header of
# test/continuous-test-suite-package-consumer.ts for the cases and for
# KNOWN_FAILURES, the ratchet of defects it expects while their fixes land.
#
# Nightly, at an hour that sits away from live-matrix (03:00 UTC) and
# model-liveness (04:00 UTC), plus on demand, plus on pull requests that change
# what a consumer receives: the manifest, the public types, or an entry point
# the exports map names.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "src/lib/types/**"
      - "src/lib/**/index.ts"
      - "src/lib/client/reactHooks.tsx"
      - "src/lib/voice/streaming/endpointer.ts"
      - "src/lib/processors/*.ts"
      - "src/lib/adapters/*.ts"
      - "src/cli/index.ts"
      - "test/continuous-test-suite-package-consumer.ts"
      - ".github/workflows/package-consumer.yml"

permissions:
  contents: read

concurrency:
  group: package-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite packs whatever dist/ holds and refuses a dist/ older than src/,
      # so the build has to come first.
      - name: Build
        run: pnpm run build

      - name: Strict consumer type-check of the packed package
        run: pnpm run test:package-consumer
