name: Deploy Landing (Vercel)

# Replaces Vercel's Git integration for the landing site.
#
# Why: the Vercel project sits on a personal (Hobby) scope with
# `gitForkProtection: true`, so every fork PR gets a "requires authorization"
# commit status that reports as FAILED — on arrival, before any build runs. No
# vercel.json / ignoreCommand can suppress that, because the authorization gate
# is upstream of the build step, and fork authors cannot be added as team
# members on a Hobby scope.
#
# Driving the deploy from Actions instead means a PR we don't want to deploy is
# SKIPPED (neutral) rather than failed, and the gate is explicit and readable.
# GitHub also withholds secrets from fork `pull_request` runs, so a fork
# physically cannot deploy even if the `if:` below were wrong — the condition is
# the intent, the secret withholding is the enforcement.

on:
  push:
    branches: [release]
    paths:
      - "landing/**"
      - ".github/workflows/landing-deploy.yml"
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/landing-deploy.yml"
  workflow_dispatch:

concurrency:
  group: landing-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Same-repo refs only. Fork PRs skip → no check, rather than a red one.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json pins "packageManager", so `vercel build` shells out to pnpm
      # for the install. Without pnpm on the runner it dies with `spawn pnpm
      # ENOENT` before the build starts. pnpm/action-setup reads the version
      # from that field, so there is one pin for every workflow and the image.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # Exact version: this CLI receives VERCEL_TOKEN. `vercel@latest` ran
      # whatever the registry served at that minute, outside any cooldown.
      - name: Install Vercel CLI (exact version)
        env:
          VERCEL_CLI_VERSION: "65.2.0"
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # push → production, pull_request/dispatch → preview.
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # The token travels in the environment (the CLI reads VERCEL_TOKEN), never
      # on argv: a `--token=` argument is visible to every process on the runner
      # and lands in any captured command line.
      #
      # Pulls project settings too — including rootDirectory=landing — so the
      # build runs against the landing app without duplicating config here.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_ENV: ${{ steps.target.outputs.env }}
        run: vercel pull --yes --environment="$TARGET_ENV"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_FLAG: ${{ steps.target.outputs.flag }}
        run: vercel build $TARGET_FLAG

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_FLAG: ${{ steps.target.outputs.flag }}
        run: |
          url="$(vercel deploy --prebuilt $TARGET_FLAG)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Landing deployed (${{ steps.target.outputs.env }})"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Restores the one thing the Git integration gave us for free.
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.url) }};
            const marker = '<!-- landing-preview -->';
            const body = `${marker}\n**Landing preview:** ${url}\n\n<sub>Deployed from \`${context.sha.slice(0, 7)}\` by the landing-deploy workflow.</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (
              await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            ).data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
