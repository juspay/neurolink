name: Live Provider Matrix (Nightly)

on:
  schedule:
    # 03:00 UTC daily — off-peak, avoids colliding with PR CI load.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The parity suite between generate() and stream() reasoning. It is
  # registered in ci.yml's `extended-suites`, but that tier runs with no
  # provider credentials by design, so `skipUnlessProviderAvailable` makes
  # every live leg SKIP there — registered, never exercised. This job is the
  # only place in CI that holds DEEPSEEK_API_KEY, which is the one credential
  # the suite reads.
  #
  # A separate job rather than a step on the sweep below. The sweep's steps
  # carry many provider credentials and this suite needs exactly one, and the
  # sweep is long enough that appending to it would queue the parity run
  # behind every other provider. The cost is a second build per nightly run.
  reasoning-parity:
    name: 🧠 Live Reasoning Parity
    runs-on: ubuntu-latest
    # Not a required check, for the same reason as the sweep below: it spends
    # a real provider credential against a real API and must not block a merge
    # on a transient upstream outage or a rotated-out secret.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Nothing after this step touches git, so the checkout token has no
          # reason to sit in .git/config where every later step can read it.
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: pnpm exec svelte-kit sync

      # The suite calls assertDistFresh() and drives the built CLI, so the
      # build is a precondition, not a convenience.
      - name: Build package
        run: pnpm run build

      # Bounded because the generate leg samples repeatedly rather than
      # treating one quiet turn as the defect, so its worst case is several
      # live round trips instead of one.
      - name: Live reasoning parity — generate() vs stream() (SKIPs cleanly without the key)
        run: pnpm run test:reasoning-parity-live
        timeout-minutes: 15
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  live-matrix:
    name: 🌐 Live Provider Matrix Sweep
    runs-on: ubuntu-latest
    # Not a required check — this workflow never appears in
    # .github/settings.yml's branch-protection contexts. It exercises real
    # provider credentials against real APIs and must not block merges on
    # transient upstream outages or missing repo secrets.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Nothing after this step touches git, so the checkout token has no
          # reason to sit in .git/config where every later step can read it.
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: pnpm exec svelte-kit sync

      - name: Build package
        run: pnpm run build

      # Bounded because this job runs multiple live sweeps back to back (this
      # one and the CLI mirror below). The CLI harness already caps each
      # child process, but nothing capped the step itself, and GitHub's
      # default job ceiling is 360 minutes — long enough for one wedged
      # provider to hold a nightly runner most of a day.
      - name: Live provider matrix sweep (self-gates cleanly when keys are absent)
        run: pnpm run test:matrix
        timeout-minutes: 30
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SAGEMAKER_ENDPOINT: ${{ secrets.SAGEMAKER_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          # The catalog derives <ID>_API_KEY, so Cloudflare is read as
          # CLOUDFLARE_API_KEY. This passed CLOUDFLARE_API_TOKEN, which
          # nothing reads — Cloudflare was silently skipped every night.
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          GMICLOUD_API_KEY: ${{ secrets.GMICLOUD_API_KEY }}
          FRIENDLI_API_KEY: ${{ secrets.FRIENDLI_API_KEY }}
