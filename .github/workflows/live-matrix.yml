          MOONSHOT_AI_API_KEY: ${{ secrets.MOONSHOT_AI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          CRUSOE_API_KEY: ${{ secrets.CRUSOE_API_KEY }}
          WANDB_INFERENCE_API_KEY: ${{ secrets.WANDB_INFERENCE_API_KEY }}
          INCEPTRON_API_KEY: ${{ secrets.INCEPTRON_API_KEY }}
          BYTEPLUS_MODELARK_API_KEY: ${{ secrets.BYTEPLUS_MODELARK_API_KEY }}
          GRADIENTAI_API_KEY: ${{ secrets.GRADIENTAI_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          BAIDU_QIANFAN_API_KEY: ${{ secrets.BAIDU_QIANFAN_API_KEY }}
          ARCEE_API_KEY: ${{ secrets.ARCEE_API_KEY }}
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          REKA_API_KEY: ${{ secrets.REKA_API_KEY }}
          THINKING_MACHINES_API_KEY: ${{ secrets.THINKING_MACHINES_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          VISPARK_API_KEY: ${{ secrets.VISPARK_API_KEY }}
          SAKANA_AI_API_KEY: ${{ secrets.SAKANA_AI_API_KEY }}
          POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}
          LEMONFOX_AI_API_KEY: ${{ secrets.LEMONFOX_AI_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          HETZNER_INFERENCE_API_KEY: ${{ secrets.HETZNER_INFERENCE_API_KEY }}
          META_MODEL_API_API_KEY: ${{ secrets.META_MODEL_API_API_KEY }}
          STACKIT_API_KEY: ${{ secrets.STACKIT_API_KEY }}
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          API_ROUTE_API_KEY: ${{ secrets.API_ROUTE_API_KEY }}
          A2AGENT_API_KEY: ${{ secrets.A2AGENT_API_KEY }}

  # Two more single-credential live suites, grouped the way reasoning-parity
  # above is: the sweep's steps carry many provider credentials and each of
  # these needs exactly one (ANTHROPIC_API_KEY), so appending either to the
  # sweep would queue it behind every other provider for no reason. Unlike
  # reasoning-parity, the two are combined into one job rather than split
  # into two: both need only the same single credential, so sharing a build
  # costs nothing extra that isolating them separately would avoid.
  anthropic-live-suites:
    name: 🤖 Live Anthropic-Only Suites
    runs-on: ubuntu-latest
    # Not a required check, for the same reason as the other jobs here: each
    # spends a real ANTHROPIC_API_KEY credential against the live API and
    # must not block a merge on a transient upstream outage or a rotated-out
    # secret.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Nothing after this step touches git, so the checkout token has no
          # reason to sit in .git/config where every later step can read it.
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: 🔄 SvelteKit Sync
        run: pnpm exec svelte-kit sync

      # Both suites call assertDistFresh(), and the thinkingConfig suite also
      # drives the built CLI, so the build is a precondition, not a
      # convenience.
      - name: Build package
        run: pnpm run build

      - name: Live thinkingConfig passthrough — generate()/stream()/CLI (SKIPs cleanly without the key)
        run: pnpm run test:thinking-config
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Live Anthropic toolChoice passthrough (SKIPs cleanly without the key)
        run: pnpm run test:anthropic-toolchoice
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # A red nightly run reaches nobody on its own: this workflow is not a
  # required check, so a provider that stops answering or a rotated-out secret
  # fails here and nothing else notices. model-liveness.yml solves the same
  # problem the same way: one rolling issue, commented on again rather than a
  # new issue every night.
  #
  # `needs` MUST list every job above: a job missing from it can fail without
  # this one running. `if: failure()`, not `always()`: a green run, and a run
  # where every suite SKIPped for want of a key (those exit 0), stay silent.
  # `issues: write` is granted to this job alone; the jobs above hold the
  # provider secrets and keep read-only contents. There is no checkout, so
  # `gh` is pointed at the repository with GH_REPO.
  notify:
    name: 🔔 Live Matrix Failure Notice
    needs: [reasoning-parity, live-matrix, anthropic-live-suites]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASONING_PARITY_RESULT: ${{ needs.reasoning-parity.result }}
          LIVE_MATRIX_RESULT: ${{ needs.live-matrix.result }}
          ANTHROPIC_SUITES_RESULT: ${{ needs.anthropic-live-suites.result }}
        run: |
          set -euo pipefail
          LABEL="live-matrix-fail"
          TITLE="Nightly live provider matrix is failing"
          BODY_FILE=$(mktemp)
          {
            echo "The nightly live-matrix workflow has a failing job."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "- Live Reasoning Parity: $REASONING_PARITY_RESULT"
            echo "- Live Provider Matrix Sweep: $LIVE_MATRIX_RESULT"
            echo "- Live Anthropic-Only Suites: $ANTHROPIC_SUITES_RESULT"
            echo
            echo "Open the run for the failing step's log."
            echo
            echo "_Filed automatically by \`.github/workflows/live-matrix.yml\`._"
          } > "$BODY_FILE"

          # One rolling issue, not one per night: comment on the open one so a
          # flaky provider cannot spam the tracker into being muted.
          EXISTING=$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "commented on #$EXISTING"
          else
            gh label create "$LABEL" \
              --description "The nightly live provider matrix has a failing job" \
              --color B60205 2>/dev/null || true
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$BODY_FILE"
          fi
