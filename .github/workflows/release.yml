name: Release and Publish

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/

      # ffmpeg is deliberately NOT installed in this workflow. Nothing these
      # jobs run needs it: no package script invokes it, and src/ shells out to
      # ffmpeg only at runtime (frame extraction, video merge, audio playback),
      # never during install, lint, typecheck, build or pack. provider-safety-net
      # has always built and run its suites without it.
      #
      # Removed after the apt install broke CI three ways in one day: a corrupt
      # published asset, a version pin that stopped resolving, and an Ubuntu
      # mirror returning Ign: for every index while apt sat for 14 minutes.
      # Because build-check is a required check, each of those blocked every
      # open pull request on a dependency none of these jobs use.
      #
      # If a job here ever runs a suite that genuinely exercises media, install
      # ffmpeg in THAT job only, and bound every wait (DPkg::Lock::Timeout,
      # Acquire::*::Timeout) plus a step timeout-minutes.

      - name: Install dependencies
        run: pnpm i

      - name: Build package
        run: pnpm run build

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: neurolink-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write # Required for OIDC authentication with npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Upgrade npm for native OIDC publish support
        run: |
          npx -y npm@11 install -g npm@11
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm run build

      - name: Build GitHub Action
        run: pnpm run build:action

      - name: Release with semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0" # Disable git hooks during automated release commits

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@juspay"

      - name: Publish to GitHub Packages
        run: |
          if [ -f "package.json" ]; then
            package_name="$(node -p "require('./package.json').name")"
            package_version="$(node -p "require('./package.json').version")"

            if lookup_output="$(npm view "${package_name}@${package_version}" version --registry https://npm.pkg.github.com 2>&1)"; then
              echo "GitHub Packages already contains ${package_name}@${package_version}; skipping publish."
            elif printf '%s\n' "$lookup_output" | grep -qxE 'npm (ERR!|error) code E404'; then
              echo "Publishing ${package_name}@${package_version} to GitHub Packages..."
              pnpm publish --access public --no-git-checks --registry https://npm.pkg.github.com
              echo "Published ${package_name}@${package_version} to GitHub Packages."
            else
              printf '%s\n' "$lookup_output" >&2
              echo "Unable to determine whether ${package_name}@${package_version} exists in GitHub Packages; refusing to publish." >&2
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
