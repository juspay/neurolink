name: Release and Publish

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/

      # ffmpeg is deliberately NOT installed in this workflow. Nothing these
      # jobs run needs it: no package script invokes it, and src/ shells out to
      # ffmpeg only at runtime (frame extraction, video merge, audio playback),
      # never during install, lint, typecheck, build or pack. provider-safety-net
      # has always built and run its suites without it.
      #
      # Removed after the apt install broke CI three ways in one day: a corrupt
      # published asset, a version pin that stopped resolving, and an Ubuntu
      # mirror returning Ign: for every index while apt sat for 14 minutes.
      # In ci.yml, where the same install ran, each of those blocked every open
      # pull request via the required build-check; here it would have stalled
      # or failed the release run, on a dependency none of these jobs use.
      #
      # If a job here ever runs a suite that genuinely exercises media, install
      # ffmpeg in THAT job only, and bound every wait (DPkg::Lock::Timeout,
      # Acquire::*::Timeout) plus a step timeout-minutes.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: neurolink-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write # Required for OIDC authentication with npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Exact version, not `npm@11`: this is the client that performs the OIDC
      # publish, and `npx -y npm@11` fetched whatever 11.x was newest at that
      # minute with no cooldown and no review. Bump deliberately; the version is
      # checked against the registry before it runs.
      - name: Install the npm client that performs the OIDC publish (exact version)
        env:
          NPM_CLI_VERSION: "11.21.1"
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_CLI_VERSION}"
          installed="$(npm --version)"
          echo "npm version: ${installed}"
          [ "$installed" = "$NPM_CLI_VERSION" ] || { echo "::error::expected npm ${NPM_CLI_VERSION}, got ${installed}"; exit 1; }

      # Frozen: a release that re-resolves ranges publishes a dependency tree no
      # pull request ever tested. The lockfile is the tree; refuse anything else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      # The committed bundle is what consumers run; CI's build-check diffs it
      # against a fresh build on every pull request. Rebuilding here proves the
      # release commit still builds; the output is not published from here.
      - name: Build GitHub Action
        run: pnpm run build:action

      - name: Release with semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0" # Disable git hooks during automated release commits

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          registry-url: "https://npm.pkg.github.com"
          scope: "@juspay"

      - name: Publish to GitHub Packages
        run: |
          if [ -f "package.json" ]; then
            package_name="$(node -p "require('./package.json').name")"
            package_version="$(node -p "require('./package.json').version")"

            if lookup_output="$(npm view "${package_name}@${package_version}" version --registry https://npm.pkg.github.com 2>&1)"; then
              echo "GitHub Packages already contains ${package_name}@${package_version}; skipping publish."
            elif printf '%s\n' "$lookup_output" | grep -qxE 'npm (ERR!|error) code E404'; then
              echo "Publishing ${package_name}@${package_version} to GitHub Packages..."
              pnpm publish --access public --no-git-checks --registry https://npm.pkg.github.com
              echo "Published ${package_name}@${package_version} to GitHub Packages."
            else
              printf '%s\n' "$lookup_output" >&2
              echo "Unable to determine whether ${package_name}@${package_version} exists in GitHub Packages; refusing to publish." >&2
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
